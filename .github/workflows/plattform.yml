# Plattform: Tests bei jeder Änderung; Veröffentlichung nur von «main» und nur nach grünen Tests.
# Geheimnisse (im GitHub-Repository unter Settings → Secrets → Actions, trägst du selbst ein):
#   CLOUDFLARE_API_TOKEN  – Token mit Rechten nur für Workers, D1 und R2 dieses Kontos
#   CLOUDFLARE_ACCOUNT_ID – Konto-ID (kein Geheimnis, aber hier zentral)
name: Plattform

on:
  push:
    branches: [main, "plattform/**"]
    paths: ["Plattform/**", ".github/workflows/plattform.yml"]
  pull_request:
    paths: ["Plattform/**"]

permissions:
  contents: read

concurrency:
  group: plattform-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: Plattform

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: Plattform/package-lock.json }
      - run: npm ci
      - run: npm run build          # nutzt die eingecheckte src/data/inhalte.json (keine Datenbank in den Tests)
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env: { WRANGLER_SEND_METRICS: "false" }

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: produktion
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: Plattform/package-lock.json }
      - run: npm ci
      - name: Sicherheitsprüfung Konfiguration
        run: |
          ! grep -q "00000000-0000-0000-0000-000000000000" wrangler.jsonc || { echo "database_id in wrangler.jsonc fehlt"; exit 1; }
          grep -q '"ENVIRONMENT": "production"' wrangler.jsonc
          grep -Eq '"ACCESS_AUD": "[^"]+"' wrangler.jsonc || { echo "ACCESS_AUD fehlt"; exit 1; }
      - name: Datenbank-Migrationen anwenden
        run: npx wrangler d1 migrations apply DB --remote
      - name: Inhalte aus der echten Datenbank holen
        run: node tools/inhalte-export.mjs --remote
      - run: npx astro build
        env: { PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAAGVYl_-nC8vY7FT4" }
      - name: Veröffentlichen
        run: npx wrangler deploy
      - name: «Webseite erzeugt» festhalten
        run: node tools/inhalte-export.mjs --remote --zeitstempel
