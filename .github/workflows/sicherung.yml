# Wöchentliche Datensicherung der Datenbank (D1) als Datei in GitHub (privat, 90 Tage aufbewahrt).
# Zusätzlich hält Cloudflare D1 «Time Travel» (Wiederherstellung auf einen Zeitpunkt der letzten Tage).
# Wiederherstellen: docs/DEPLOYMENT.md → «Wiederherstellung». Fotos sind NICHT enthalten (bewusst: nur 30 Tage online).
name: Datensicherung

on:
  schedule:
    - cron: "30 2 * * 1"   # montags 02:30 UTC
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: Plattform

jobs:
  sichern:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: produktion
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: Plattform/package-lock.json }
      - run: npm ci
      - name: Datenbank exportieren
        run: |
          datei="sicherung-$(date -u +%Y-%m-%d).sql"
          npx wrangler d1 export DB --remote --output "$datei"
          test -s "$datei"
          grep -q "CREATE TABLE bookings" "$datei"
          gzip "$datei"
          echo "DATEI=$datei.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DATEI }}
          path: Plattform/${{ env.DATEI }}
          retention-days: 90
          if-no-files-found: error
